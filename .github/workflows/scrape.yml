name: Robot cen
on:
  schedule:
    - cron: "17 5,11,17,22 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scraper/scrape.py", ".github/workflows/scrape.yml"]
permissions:
  contents: write
concurrency:
  group: scrape
  cancel-in-progress: false
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r scraper/requirements.txt
      - name: Zbieranie promocji
        run: python scraper/scrape.py --data data --debug debug
      - name: Zapis
        run: |
          git config user.name "szafa-bot"
          git config user.email "szafa-bot@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -qm "Promocje $(date -u +%Y-%m-%d\ %H:%M)"
            git pull -q --rebase origin main
            git push -q origin HEAD:main
          fi
      - name: Logi na galaz ci-scrape
        if: always()
        run: |
          mkdir -p debug; cd debug
          git init -q -b ci-scrape
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add -A; git commit -qm "scrape $GITHUB_RUN_NUMBER" || true
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-scrape
