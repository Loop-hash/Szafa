name: APK
# Buduje apkę i wystawia ją jako wydanie "najnowsza":
# https://github.com/Loop-hash/Szafa/releases/tag/najnowsza
on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/apk.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apk
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: app/package-lock.json }
      - uses: gradle/actions/setup-gradle@v4
      - name: Zależności
        working-directory: app
        run: npm ci
      - name: Numer wersji
        working-directory: app
        run: printf '{"build": %s, "sha": "%s"}\n' "$GITHUB_RUN_NUMBER" "${GITHUB_SHA::7}" > www/build.json
      - name: Budowanie APK
        working-directory: app
        run: |
          set -o pipefail
          mkdir -p ../debug
          npx cap sync android 2>&1 | tee ../debug/sync.log
          cd android && chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee ../../debug/gradle.log
          cp app/build/outputs/apk/release/app-release.apk ../../szafa.apk
      - name: Wydanie "najnowsza"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Szafa 0.1.${GITHUB_RUN_NUMBER}

          Pobierz szafa.apk i otwórz na telefonie z Androidem.
          Później apka aktualizuje się sama (Ustawienia → sprawdź aktualizację).

          build: ${GITHUB_RUN_NUMBER}"
          if gh release view najnowsza >/dev/null 2>&1; then
            gh release upload najnowsza szafa.apk --clobber
            gh release edit najnowsza --title "Szafa 0.1.${GITHUB_RUN_NUMBER}" --notes "$NOTES"
          else
            gh release create najnowsza szafa.apk --title "Szafa 0.1.${GITHUB_RUN_NUMBER}" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
      - name: Logi na galaz ci-apk
        if: always()
        run: |
          mkdir -p debug; cd debug
          tail -c 200000 gradle.log > g.log 2>/dev/null && mv g.log gradle.log || true
          git init -q -b ci-apk
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add -A; git commit -qm "apk $GITHUB_RUN_NUMBER" || true
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-apk
